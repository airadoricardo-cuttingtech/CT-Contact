<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ricardo Airado | CuttingTech</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;

            font-family: Arial, Helvetica, sans-serif;

            background: #f3f4f6;
            color: #1a1a1a;
        }

        .card {
            width: 100%;
            max-width: 420px;

            background: white;
            border-radius: 18px;
            padding: 34px 28px;

            text-align: center;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .company {
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #17365d;

            margin-bottom: 26px;
        }

        h1 {
            margin: 0 0 7px 0;

            font-size: 30px;
            color: #17365d;
        }

        .title {
            margin-bottom: 6px;

            font-size: 17px;
            font-weight: bold;
        }

        .slogan {
            margin-bottom: 28px;

            font-size: 14px;
            color: #666;
        }

        .contact {
            margin: 12px 0;

            font-size: 16px;
        }

        .contact a {
            color: #17365d;
            text-decoration: none;
        }

        .save-button {
            display: block;

            width: 100%;

            margin-top: 30px;
            padding: 16px;

            border-radius: 10px;

            background: #17365d;
            color: white;

            text-decoration: none;

            font-size: 18px;
            font-weight: bold;
        }

        .save-button:active {
            transform: scale(0.98);
        }

        .footer {
            margin-top: 24px;

            font-size: 12px;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="company">
            CUTTINGTECH
        </div>

        <h1>
            Ricardo Airado
        </h1>

        <div class="title">
            Head of Technology
        </div>

        <div class="slogan">
            An innovative Company.
        </div>

        <div class="contact">
            <a href="tel:+12393248149">
                +1 (239) 324-8149
            </a>
        </div>

        <div class="contact">
            <a href="mailto:ricardo@mycuttingtech.com">
                ricardo@mycuttingtech.com
            </a>
        </div>

        <a
            class="save-button"
            href="ricardo.vcf">
            Save Contact
        </a>

        <div class="footer">
            CuttingTech LLC
        </div>

    </div>

</body>
</html>
